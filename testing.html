<!DOCTYPE html>
<html>
<head>
  <title>Zombie Apocalypse World</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  <script src="zombie.js"></script>
  <script src="script.js"></script>
  <script src="kinema.js"></script>
  <script src="bullet.js"></script>
</head>
<body>
  <a-scene stats >
    <a-assets>
      <a-asset-item id="zombie" src="assets/zombie/scene.gltf"></a-asset-item>
      <a-asset-item id="Bosszombie" src="assets/boss/scene.gltf"></a-asset-item>
      <a-asset-item id="gun" src="assets/ak47/scene.gltf"></a-asset-item>
      <a-asset-item id="bullet" src="assets/Bullet/scene.gltf"></a-asset-item>
      <img id="crosshair" src="image/crosshair.png" />
    </a-assets>

   <a-plane  position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#7BC8A4"></a-plane>
  
    <a-sky color="#2B2B2B"></a-sky>

    <a-light type="ambient" color="#999"></a-light>
    <a-light type="directional" position="50 100 50" intensity="0.8"></a-light>
   
    <a-box position="10 5 10"  scale="10 10 10" color="#FF0000"></a-box>
   
    

    <a-entity id="player" >
      <a-camera look-controls="pointerLockEnabled: true">
        <a-entity id="gun1" gltf-model="#gun" scale="0.002 0.002 0.002" position="1 -0.45 -1" animation-mixer="clip: Armature.003|idle"></a-entity>
        <a-cursor material="src: #crosshair" scale="3 3 3" position="0 0 -1"></a-cursor>
      </a-camera>
    </a-entity>
    
  </a-scene>
</body>
</html>
