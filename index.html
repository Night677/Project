<!DOCTYPE html>
<!-- filepath: /workspaces/codespaces-blank/index.html -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Shooter</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        .start-button, .mode-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        button {
            padding: 20px 40px;
            font-size: 2em;
            cursor: pointer;
            background-color: #ff0000;
            border: none;
            color: #fff;
            border-radius: 5px;
            margin: 10px;
            flex: 1;
        }
        button:hover {
            background-color: #cc0000;
        }
        .mode-buttons {
            display: none;
            flex-direction: row;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="start-button">
            <button id="startButton" onclick="showModes()">Start Game</button>
        </div>
        <div id="modeButtons" class="mode-buttons">
            <button onclick="startMode('testing')">Survive</button>
            <button onclick="startMode('tests')">Explore</button>
            <button onclick="startMode('endless')">Endless</button>
        </div>
    </div>
    <script>
        function showModes() {
            document.querySelector('.start-button').style.display = 'none';
            document.getElementById('modeButtons').style.display = 'flex';
        }

        function startMode(mode) {
            window.location.href = mode + ".html";
        }
    </script>
</body>
</html>
