<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  <script src="zombie.js"></script>
  <script src="wave.js"></script>
  <script src="fastzombie.js"></script>
  <script src="bullet.js"></script>
  </head>
  <body>
    <a-scene physics="debug: false">
      <a-assets>
        <a-asset-item id="building" src="wave_asset/asia_building/scene.gltf"></a-asset-item>
        <a-asset-item id="car" src="wave_asset/car/scene.gltf"></a-asset-item>
        <a-asset-item id="road" src="wave_asset/road_hd/scene.gltf"></a-asset-item>
		    <a-asset-item id="grass" src="wave_asset/grass/scene.gltf"></a-asset-item>
        <a-asset-item id="gun" src="assets/ak47/scene.gltf"></a-asset-item>
        <a-asset-item id="bullet" src="assets/Bullet/scene.gltf"></a-asset-item>
        <a-asset-item id="fast" src="assets/zombiefast/scene.gltf"></a-asset-item>
        <a-asset-item id="zombie" src="assets/zombie/scene.gltf"></a-asset-item>
        <img id="crosshair" src="image/crosshair.png" />
      </a-assets>
      <a-entity gltf-model="#road" scale="0.5 0.5 0.50"></a-entity>
	  <a-entity gltf-model="#road" position="0 0 117" scale="0.5 0.5 0.50"></a-entity>
	  <a-entity gltf-model="#road" position="0 0 -117" scale="0.5 0.5 0.50"></a-entity>
	  <a-box depth="351" width="5" height="0.1" position="-11.2 0 0" color="#4b7e26"></a-box>
	  <a-box depth="351" width="5" height="0.1" position="11.2 0 0" color="#4b7e26"></a-box>
   
    <a-sky color="#1a1a1a"></a-sky>
   <script>
      for (let i = 0; i < 24; i++) {
        let positionZ = i * 7.5;
        document.write(`<a-entity gltf-model="#grass" position="11.4 0.1 ${positionZ}" scale="0.5 0.5 0.32" rotation="0 90 0"></a-entity>`);
        document.write(`<a-entity gltf-model="#grass" position="11.4 0.1 ${-positionZ}" scale="0.5 0.5 0.32" rotation="0 90 0"></a-entity>`);
        document.write(`<a-entity gltf-model="#grass" position="-11.4 0.1 ${positionZ}" scale="0.5 0.5 0.32" rotation="0 90 0"></a-entity>`);
        document.write(`<a-entity gltf-model="#grass" position="-11.4 0.1 ${-positionZ}" scale="0.5 0.5 0.32" rotation="0 90 0"></a-entity>`);
      }
    
      for (let i = 0; i < 12; i++) {
        let positionZ = i * 15.5;
        
        document.write(`<a-entity gltf-model="#building" position="19 0.1 ${7.5 + positionZ}" scale="0.1 0.15 0.1" rotation="0 0 0"></a-entity>`);
        document.write(`<a-entity gltf-model="#building" position="19 0.1 -${7.5 + positionZ}" scale="0.1 0.15 0.1" rotation="0 0 0"></a-entity>`);
        document.write(`<a-entity gltf-model="#building" position="-19 0.1 ${7.5 + positionZ}" scale="0.1 0.15 0.1" rotation="0 0 0"></a-entity>`);
        document.write(`<a-entity gltf-model="#building" position="-19 0.1 -${7.5 + positionZ}" scale="0.1 0.15 0.1" rotation="0 0 0"></a-entity>`);
      }
      for (let i = 0; i < 6; i++) {
        let positionZ = i * 35;
        
        document.write(`<a-entity gltf-model="#car"  position="-5 0 ${positionZ}" scale="0.32 0.32 0.32" rotation="0 0 0"></a-entity>`);
        document.write(`<a-entity gltf-model="#car"  position="5 0 ${positionZ}" scale="0.32 0.32 0.32" rotation="0 180 0"></a-entity>`);
        document.write(`<a-entity gltf-model="#car"  position="-5 0 -${positionZ}" scale="0.32 0.32 0.32" rotation="0 0 0"></a-entity>`);
        document.write(`<a-entity gltf-model="#car"  position="5 0 -${positionZ}" scale="0.32 0.32 0.32" rotation="0 180 0"></a-entity>`);
       
      }
    </script>
    <a-entity id="player" >
      <a-camera look-controls="pointerLockEnabled: true;" wasd-controls="acceleration: 25">
        <a-entity id="gun1" gltf-model="#gun" scale="0.002 0.002 0.002" position="0 -0.5 -1" animation-mixer="clip: Armature.003|idle"></a-entity>
        <a-cursor material="src: #crosshair" scale="3 3 3" position="0 0 -1"></a-cursor>
      </a-camera>
    </a-entity>
    </a-scene>
    <div id="wave-info" style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: white; font-size: 50px; text-align: center;">
      Wave: 1<br>
      Zombies: 0
    </div>
    <div id="player-info" style="position: absolute; top: 60px; left: 10%; transform: translateX(-50%); color: white; font-size: 50px; text-align: center;">
      Health: 100<br>
      Bullets: 20
    </div>
    <script>
      function sceneLoaded() {
        setTimeout(() => {
          alert("Welcome to the Zombie Shooter! \n\nObjective: \nSurive the endless waves of zombies. Complete the waves by defeating all the zombies. \nAlso Please give the world a second to load \n\nControls: \nWASD - Move \nShift - Sprint \nMouse - Look around \nLeft Click - Shoot \nShift - Sprinting \n\nGood Luck!");
        }, 1000);
      }
  
      document.querySelector('a-scene').addEventListener('loaded', sceneLoaded);
    </script>
  </body>
</html>
